<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXSKILL - 次の自分をつくるスキル学習</title>
<style>
/* ===== リセット・ベース ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #F5F3FF;
  color: #1a1a2e;
  line-height: 1.7;
  padding-bottom: 80px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== カラー変数 ===== */
:root {
  --primary: #7F77DD;
  --primary-light: #A49BE8;
  --primary-dark: #5A50C7;
  --primary-bg: #F5F3FF;
  --primary-surface: #EDE9FE;
  --accent-green: #34D399;
  --accent-orange: #FBBF24;
  --accent-pink: #F472B6;
  --accent-blue: #60A5FA;
  --accent-red: #F87171;
  --accent-teal: #2DD4BF;
  --text-primary: #1a1a2e;
  --text-secondary: #6B7280;
  --text-light: #9CA3AF;
  --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(127,119,221,0.1);
  --shadow-md: 0 4px 12px rgba(127,119,221,0.15);
  --shadow-lg: 0 8px 24px rgba(127,119,221,0.2);
  --radius: 16px;
  --radius-sm: 10px;
}
a { color: var(--primary); text-decoration: none; }

/* ===== ログイン画面 ===== */
.auth-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, var(--primary) 0%, #2d2b55 100%);
  display: flex; justify-content: center; align-items: center; z-index: 999;
}
.auth-box {
  background: var(--white); border-radius: var(--radius); padding: 36px 28px;
  max-width: 400px; width: 90%; text-align: center;
}
.auth-box .auth-logo { font-size: 2.5rem; margin-bottom: 8px; }
.auth-box h2 { font-size: 1.2rem; margin-bottom: 4px; }
.auth-box .auth-sub { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 20px; }
.auth-box input {
  width: 100%; padding: 12px 16px; border: 2px solid var(--primary-surface);
  border-radius: var(--radius-sm); font-size: 0.9rem; margin-bottom: 10px;
}
.auth-box input:focus { outline: none; border-color: var(--primary); }
.auth-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white; border: none; border-radius: var(--radius-sm); font-size: 0.95rem;
  font-weight: 700; cursor: pointer; margin-top: 4px;
}
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-toggle {
  margin-top: 16px; font-size: 0.8rem; color: var(--text-secondary);
}
.auth-toggle a { cursor: pointer; color: var(--primary); font-weight: 600; }
.auth-error { color: var(--accent-red); font-size: 0.8rem; margin-top: 10px; min-height: 1.2em; }
.pw-wrap {
  position: relative; width: 100%; margin-bottom: 10px;
}
.pw-wrap input { margin-bottom: 0; padding-right: 48px; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; font-size: 1.2rem; cursor: pointer;
  color: var(--text-light); padding: 4px;
}

/* ===== ヘッダー ===== */
.app-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-md);
}
.app-header h1 {
  font-size: 1.2rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-header .subtitle {
  font-size: 0.75rem;
  opacity: 0.85;
  margin-top: 2px;
}
.header-actions {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 8px;
}
.header-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.header-btn:hover { background: rgba(255,255,255,0.3); }

/* ===== ボトムナビゲーション（4タブ） ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  display: flex;
  justify-content: space-around;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 8px;
  border: none;
  background: none;
  color: var(--text-light);
  font-size: 0.6rem;
  cursor: pointer;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
  min-width: 0;
  flex: 1;
}
.nav-item .nav-icon { font-size: 1.3rem; transition: transform 0.2s; }
.nav-item.active { color: var(--primary); font-weight: 700; }
.nav-item.active .nav-icon { transform: scale(1.15); }

/* ===== 画面コンテナ ===== */
.screen { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== ホーム画面 ===== */
.welcome-card {
  background: linear-gradient(135deg, var(--primary) 0%, #9B8FE8 50%, var(--accent-pink) 100%);
  color: white;
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.welcome-card::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.welcome-card::after {
  content: '';
  position: absolute;
  bottom: -20px; left: -20px;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.welcome-card h2 { font-size: 1.3rem; margin-bottom: 4px; position: relative; }
.welcome-card p { font-size: 0.85rem; opacity: 0.9; position: relative; }
.welcome-card .welcome-emoji { font-size: 2rem; margin-bottom: 8px; }

.progress-overview {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.progress-overview h3 {
  font-size: 0.9rem;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.progress-bar-container {
  background: var(--primary-surface);
  border-radius: 10px;
  height: 12px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  background: linear-gradient(90deg, var(--primary), var(--accent-green));
  height: 100%;
  border-radius: 10px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.progress-text {
  font-size: 0.8rem;
  color: var(--text-secondary);
  text-align: right;
}

.section-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.recommend-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--accent-orange);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.recommend-card:active { transform: scale(0.98); }
.recommend-label {
  font-size: 0.7rem;
  color: var(--accent-orange);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.recommend-title { font-size: 1rem; font-weight: 700; }
.recommend-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

/* ===== チャプターカード ===== */
.chapter-list { display: flex; flex-direction: column; gap: 12px; }
.chapter-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.chapter-card:active { transform: scale(0.98); box-shadow: var(--shadow-md); }
.chapter-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  flex-shrink: 0;
}
.chapter-icon.purple { background: #EDE9FE; }
.chapter-icon.blue { background: #DBEAFE; }
.chapter-icon.pink { background: #FCE7F3; }
.chapter-icon.green { background: #D1FAE5; }
.chapter-icon.orange { background: #FEF3C7; }
.chapter-icon.teal { background: #CCFBF1; }
.chapter-info { flex: 1; min-width: 0; }
.chapter-title {
  font-size: 0.9rem;
  font-weight: 700;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chapter-meta {
  font-size: 0.75rem;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
}
.status-badge.not_started { background: #F3F4F6; color: var(--text-secondary); }
.status-badge.in_progress { background: #FEF3C7; color: #D97706; }
.status-badge.completed { background: #D1FAE5; color: #059669; }
.chapter-arrow {
  color: var(--text-light);
  font-size: 1.2rem;
  flex-shrink: 0;
}

/* ===== 学習画面 ===== */
.learning-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.learning-tabs::-webkit-scrollbar { display: none; }
.learning-tab {
  padding: 8px 18px;
  border-radius: 20px;
  border: 2px solid var(--primary-surface);
  background: var(--white);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.learning-tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.learning-stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.learning-stat-item {
  background: var(--white);
  border-radius: var(--radius-sm);
  padding: 14px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.learning-stat-item .ls-num {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--primary);
}
.learning-stat-item .ls-label {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-top: 2px;
}
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 3.5rem; margin-bottom: 12px; }
.empty-state .empty-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.empty-state .empty-desc { font-size: 0.8rem; line-height: 1.6; }

/* ===== チャプター詳細画面 ===== */
.detail-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.back-btn {
  background: var(--white);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s;
}
.back-btn:active { background: var(--primary-surface); }
.detail-title-area { flex: 1; }
.detail-title { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.detail-meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

.detail-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  border-radius: var(--radius);
  padding: 28px 24px;
  margin-bottom: 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.detail-hero::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.detail-hero .hero-icon { font-size: 3rem; margin-bottom: 8px; position: relative; }
.detail-hero .hero-desc { font-size: 0.9rem; opacity: 0.95; line-height: 1.7; position: relative; }

.content-section {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.content-section h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-primary);
}
.goals-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.goals-list li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.9rem;
  line-height: 1.5;
}
.goals-list .goal-check {
  color: var(--accent-green);
  font-size: 1.1rem;
  flex-shrink: 0;
  margin-top: 1px;
}
.body-content {
  font-size: 0.9rem;
  line-height: 1.85;
}
.body-content h4 {
  font-size: 1rem;
  font-weight: 700;
  margin: 24px 0 10px;
  color: var(--primary-dark);
  padding-left: 12px;
  border-left: 3px solid var(--primary);
}
.body-content h4:first-child { margin-top: 0; }
.body-content p { margin-bottom: 14px; }
.body-content ul, .body-content ol { margin: 10px 0 14px 20px; }
.body-content li { margin-bottom: 6px; }
.body-content strong { color: var(--primary-dark); }
.body-content code {
  background: var(--primary-surface);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.85em;
  font-family: 'SF Mono', 'Menlo', monospace;
}
.body-content blockquote {
  border-left: 3px solid var(--primary-light);
  padding: 12px 16px;
  margin: 14px 0;
  background: var(--primary-bg);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.88rem;
  color: var(--text-secondary);
}

.points-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.point-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  background: var(--primary-surface);
  border-radius: var(--radius-sm);
}
.point-num {
  width: 28px;
  height: 28px;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  flex-shrink: 0;
}
.point-text { font-size: 0.88rem; flex: 1; line-height: 1.6; }

.practice-box {
  background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
  border-radius: var(--radius-sm);
  padding: 20px;
}
.practice-box .practice-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: #D97706;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.practice-box .practice-text {
  font-size: 0.9rem;
  color: #92400E;
  line-height: 1.7;
}

.complete-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow-md);
}
.complete-btn:active { transform: scale(0.98); }
.complete-btn.completed {
  background: linear-gradient(135deg, var(--accent-green) 0%, #10B981 100%);
}

/* ===== 探す画面（コンテンツ生成） ===== */
.generate-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}
.generate-card h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.generate-card > p {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.input-group { margin-bottom: 16px; }
.input-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.input-group input, .input-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--primary-surface);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-family: inherit;
  transition: border-color 0.2s;
  background: var(--white);
  color: var(--text-primary);
}
.input-group input:focus, .input-group textarea:focus {
  outline: none;
  border-color: var(--primary);
}
.input-group textarea { resize: vertical; min-height: 80px; }
/* ===== マイページ ===== */
.profile-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 28px 24px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}
.profile-avatar {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent-pink) 100%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  margin: 0 auto 12px;
}
.profile-card h3 { font-size: 1.1rem; }
.profile-card p { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--white);
  border-radius: var(--radius-sm);
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-num {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
}
.stat-label {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ===== マイページ ログアウトセクション ===== */
.logout-section {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}

.settings-section {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
}
.settings-section h3 {
  font-size: 0.9rem;
  font-weight: 700;
  padding: 16px 20px 8px;
  color: var(--text-secondary);
}
.settings-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-top: 1px solid #F3F4F6;
  cursor: pointer;
  transition: background 0.2s;
}
.settings-item:active { background: #F9FAFB; }
.settings-item .si-icon { font-size: 1.2rem; }
.settings-item .si-label { flex: 1; font-size: 0.9rem; }
.settings-item .si-arrow { color: var(--text-light); }
.danger-btn {
  width: calc(100% - 40px);
  margin: 0 20px 20px;
  padding: 12px;
  background: #FEE2E2;
  color: var(--accent-red);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.danger-btn:active { background: #FECACA; }
.logout-btn-mypage {
  width: calc(100% - 40px);
  margin: 0 20px 20px;
  padding: 12px;
  background: var(--primary-surface);
  color: var(--primary-dark);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}

/* ===== コースカード ===== */
.course-list { display: flex; flex-direction: column; gap: 16px; }
.course-card {
  border-radius: var(--radius);
  padding: 24px;
  color: white;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow-md);
}
.course-card:active { transform: scale(0.98); }
.course-card::before {
  content: '';
  position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.course-card::after {
  content: '';
  position: absolute; bottom: -20px; left: -20px;
  width: 80px; height: 80px;
  background: rgba(255,255,255,0.08);

      body: '<h4>プロンプトって何？</h4><p><strong>プロンプト</strong>とは、AIに送る指示文・質問文のことです。レストランで注文するのと同じで、「なんかおいしいもの」と頼むより「辛さ控えめの四川麻婆豆腐、ご飯大盛りで」と言った方が、望みどおりのものが出てきますよね。AIも同じです。</p><p>プロンプトの質＝回答の質。これがAI活用の最重要ポイントです。</p><h4>いいプロンプトの3つの要素</h4><p>いいプロンプトには、次の3つの要素が入っています。</p><ul><li><strong>①役割（Role）：</strong>「あなたは〇〇の専門家です」とAIに役割を与える。これだけで回答の専門性が格段に上がります</li><li><strong>②条件（Context）：</strong>背景情報や制約条件を伝える。「大学1年生向けに」「300字以内で」「箇条書きで」など</li><li><strong>③出力形式（Format）：</strong>どんな形で答えてほしいかを指定する。「表形式で」「メリット・デメリットに分けて」など</li></ul><blockquote>覚え方：「誰に・何を・どう答えてほしいか」を明確にすればOK！</blockquote><h4>実例で見る：ダメなプロンプト → いいプロンプト</h4><p><strong>ダメな例：</strong></p><p><code>マーケティングについて教えて</code></p><p>→ 範囲が広すぎて、教科書みたいな一般論が返ってきます。</p><p><strong>改善例：</strong></p><p><code>あなたはマーケティングの大学教授です。大学2年生が初めてマーケティングを学ぶ授業のレポート（2000字）を書くために、以下の内容を箇条書きでまとめてください：①マーケティングの定義 ②4P分析の概要 ③身近な企業での具体例1つ</code></p><p>→ 自分の状況にぴったりの、すぐ使える回答が返ってきます。</p><h4>上級テクニック：ステップバイステップ</h4><p>複雑な作業をさせたいときは、<strong>一度に全部頼まず段階的に指示する</strong>のがコツです。</p><p>例えば、プレゼン資料を作りたいとき：</p><ul><li>ステップ1：「〇〇というテーマでプレゼンの構成案を5スライド分作って」</li><li>ステップ2：「2枚目のスライドの内容をもっと具体的に書いて」</li><li>ステップ3：「全体を大学生向けのカジュアルな口調に直して」</li></ul><p>このように会話を重ねることで、自分の理想に近い成果物に仕上げていけます。</p><h4>もっと使えるプロンプトテンプレート集</h4><p>すぐ使えるテンプレートをいくつか紹介します。自分の状況に合わせてカスタマイズしてみてください。</p><ul><li><strong>要約：</strong>「以下の文章を、大学生にもわかるように3行で要約して。専門用語には簡単な説明を添えて。」</li><li><strong>比較分析：</strong>「AとBの違いを、メリット・デメリットの表形式でまとめて。判断基準も示して。」</li><li><strong>アイデア出し：</strong>「〇〇というテーマで、ユニークなアイデアを10個出して。実現可能性も★3段階で評価して。」</li><li><strong>フィードバック：</strong>「以下の文章を読んで、良い点3つと改善点3つを具体的に指摘して。」</li></ul>',

// ===== 認証処理 =====
function togglePasswordVisibility() {
  var input = document.getElementById('auth-password');
  var btn = input.parentElement.querySelector('.pw-toggle');
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁'; }
}

function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  var btn = document.getElementById('auth-btn');
  var toggle = document.getElementById('auth-toggle');
  var sub = document.getElementById('auth-subtitle');
  document.getElementById('auth-error').textContent = '';
  if (isRegisterMode) {
    btn.textContent = '新規登録';
    toggle.innerHTML = 'アカウントをお持ちの方は <a onclick="toggleAuthMode()">ログイン</a>';
    sub.textContent = '管理者から許可されたメールアドレスで登録できます';
  } else {
    btn.textContent = 'ログイン';
    toggle.innerHTML = 'アカウントがない方は <a onclick="toggleAuthMode()">新規登録</a>';
    sub.textContent = 'アカウントにログインしてください';
  }
}

function handleAuth() {
  var email = document.getElementById('auth-email').value.trim().toLowerCase();
  var password = document.getElementById('auth-password').value;
  var errorEl = document.getElementById('auth-error');
  var btn = document.getElementById('auth-btn');
  errorEl.textContent = '';

  if (!email || !password) { errorEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  if (password.length < 6) { errorEl.textContent = 'パスワードは6文字以上にしてください'; return; }

  btn.disabled = true;

  if (isRegisterMode) {
    // 新規登録：まず許可メアドかチェック（全件取得して照合）
    db.collection('approved_emails').get()
      .then(function(snapshot) {
        var isApproved = false;
        console.log('[登録] 入力メアド:', email);
        console.log('[登録] approved_emails件数:', snapshot.size);
        snapshot.forEach(function(doc) {
          var d = doc.data();
          console.log('[登録] 許可メアド:', d.email);
          if (d.email && d.email.trim().toLowerCase() === email) { isApproved = true; }
        });
        if (!isApproved) {
          errorEl.textContent = 'このメールアドレスは許可されていません。管理者にお問い合わせください。';
          btn.disabled = false;
          return Promise.reject('not_approved');
        }
        return auth.createUserWithEmailAndPassword(email, password);
      })
      .then(function(cred) {
        if (!cred) return;
        // Firestoreにユーザードキュメント作成
        return db.collection('users').doc(cred.user.uid).set({
          email: email,
          chapterStatuses: {},
          customChapters: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastLogin: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .catch(function(err) {
        btn.disabled = false;
        if (err === 'not_approved') return;
        if (err.code === 'auth/email-already-in-use') errorEl.textContent = 'このメールアドレスは既に登録されています';
        else if (err.code === 'auth/invalid-email') errorEl.textContent = 'メールアドレスの形式が正しくありません';
        else if (err.code === 'auth/weak-password') errorEl.textContent = 'パスワードが弱すぎます（6文字以上）';
        else if (err.message) errorEl.textContent = err.message;
      });
  } else {
    // ログイン
    auth.signInWithEmailAndPassword(email, password)
      .then(function(cred) {
        // lastLoginを更新
        return db.collection('users').doc(cred.user.uid).update({
          lastLogin: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function() {
          // ドキュメントがない場合は作成
          return db.collection('users').doc(cred.user.uid).set({
            email: email,
            chapterStatuses: {},
            customChapters: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
      })
      .catch(function(err) {
        btn.disabled = false;
        if (err.code === 'auth/user-not-found') errorEl.textContent = 'アカウントが見つかりません。新規登録してください。';
        else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') errorEl.textContent = 'メールアドレスまたはパスワードが間違っています';
        else if (err.code === 'auth/invalid-email') errorEl.textContent = 'メールアドレスの形式が正しくありません';
        else if (err.message) errorEl.textContent = err.message;
      });
  }
}

function handleLogout() {
  if (!confirm('ログアウトしますか？')) return;
  auth.signOut();
}

// ===== Firebase認証状態監視 =====
auth.onAuthStateChanged(function(user) {
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-main').style.display = 'block';
    document.getElementById('auth-btn').disabled = false;
    initApp();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-main').style.display = 'none';
  }
});

// ===== アプリ初期化（ログイン後） =====
function initApp() {
  loadUserData().then(function() {
    setupNavigation();
    setupLearningTabs();
    updateWelcomeGreeting();
    renderHome();
    updateProfileSection();
  });
}

function updateProfileSection() {
  if (currentUser) {
    document.getElementById('profile-email').textContent = currentUser.email;
    document.getElementById('profile-name').textContent = 'NEXSKILL学習者';
  }
}

function updateWelcomeGreeting() {
  var h = new Date().getHours();
  var el = document.getElementById('welcome-greeting');
  if (h < 6) el.textContent = '夜更かしして勉強？偉い！';
  else if (h < 12) el.textContent = 'おはよう！今日もスキルアップ！';
  else if (h < 18) el.textContent = '午後も集中！レベルアップ！';
  else el.textContent = '今日もお疲れさま！学び続けよう！';
}

// ===== Firestore データ読み書き =====
function loadUserData() {
  if (!currentUser) return Promise.resolve();
  return db.collection('users').doc(currentUser.uid).get()
    .then(function(doc) {
      var data = doc.exists ? doc.data() : { chapterStatuses: {}, customChapters: [] };
      var statuses = data.chapterStatuses || {};
      var customChapters = data.customChapters || [];

      // DEFAULT_CHAPTERSをベースにchapters配列を構築
      chapters = DEFAULT_CHAPTERS.map(function(def) {
        var ch = JSON.parse(JSON.stringify(def));
        ch.status = statuses[ch.id] || 'not_started';
        return ch;
      });

      // カスタムチャプターを追加
      customChapters.forEach(function(custom) {
        custom.status = statuses[custom.id] || 'not_started';
        chapters.push(custom);
      });
    })
    .catch(function(err) {
      console.error('データ読み込みエラー:', err);
      // フォールバック：デフォルトチャプターのみ表示
      chapters = DEFAULT_CHAPTERS.map(function(def) {
        var ch = JSON.parse(JSON.stringify(def));
        ch.status = 'not_started';
        return ch;
      });
    });
}

function saveUserData() {
  if (!currentUser) return Promise.resolve();
  // chapterStatuses: 全チャプターのステータスをobjectで保存
  var statuses = {};
  chapters.forEach(function(ch) { statuses[ch.id] = ch.status; });

  // customChapters: カスタムチャプターのみ保存（コンテンツ含む）
  var customs = chapters.filter(function(ch) { return ch.id.startsWith('chapter_custom_'); })
    .map(function(ch) {
      return { id: ch.id, title: ch.title, icon: ch.icon, color: ch.color, estimatedMinutes: ch.estimatedMinutes, content: ch.content };
    });

  return db.collection('users').doc(currentUser.uid).set({
    email: currentUser.email,
    chapterStatuses: statuses,
    customChapters: customs,
    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true })
  .catch(function(err) {
    console.error('データ保存エラー:', err);
    showToast('⚠️ データの保存に失敗しました');
  });
}

// ===== ナビゲーション =====
function setupNavigation() {
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
      switchScreen(item.dataset.screen);
    });
  });
}

// 画面ごとの描画関数を登録（タブ追加時はここに足すだけ）
var SCREEN_RENDERERS = {
  home: function() { renderHome(); },
  learn: function() { renderLearn(); },
  mypage: function() { renderMyPage(); },
  course: function() { renderCourseDetail(); }
};

function switchScreen(screenId) {
  // 画面が存在するかチェック（タイポ防止）
  var screenEl = document.getElementById('screen-' + screenId);
  if (!screenEl) { console.error('[switchScreen] 画面が見つかりません: screen-' + screenId); return; }

  // 戻り先を記録（detail/courseなどサブ画面は戻り先にしない）
  if (currentScreen !== 'detail' && currentScreen !== 'course') previousScreen = currentScreen;
  currentScreen = screenId;

  // 画面切り替え
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  screenEl.classList.add('active');

  // ナビハイライト
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var navItem = document.querySelector('.nav-item[data-screen="' + screenId + '"]');
  if (navItem) navItem.classList.add('active');

  // 画面ごとの描画
  if (SCREEN_RENDERERS[screenId]) SCREEN_RENDERERS[screenId]();

  window.scrollTo(0, 0);
}

function goBackFromDetail() {
  if (currentCourseId) { switchScreen('course'); }
  else { switchScreen(previousScreen); }
}

function goBackFromCourse() {
  currentCourseId = null;
  switchScreen('home');
}

// ===== ホーム画面 =====
function renderHome() {
  renderProgress();
  renderRecommend();
  renderCourseList();
}

function renderProgress() {
  var total = chapters.length;
  var completed = chapters.filter(function(c) { return c.status === 'completed'; }).length;
  var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = completed + ' / ' + total + ' チャプター完了';
}

function renderRecommend() {
  var area = document.getElementById('recommend-area');
  var next = chapters.find(function(c) { return c.status === 'in_progress'; });
  if (!next) next = chapters.find(function(c) { return c.status === 'not_started'; });
  if (!next) {
    if (chapters.length > 0 && chapters.every(function(c) { return c.status === 'completed'; })) {
      area.innerHTML = '<div class="recommend-card" style="border-left-color:var(--accent-green);cursor:default;"><div class="recommend-label" style="color:var(--accent-green);">🎉 おめでとう！</div><div class="recommend-title">全チャプター完了！</div><div class="recommend-desc">「探す」タブから新しいチャプターを追加してみよう</div></div>';
    } else { area.innerHTML = ''; }
    return;
  }
  area.innerHTML = '<div class="recommend-card" onclick="openChapter(\'' + next.id + '\')"><div class="recommend-label">⭐ 今日のおすすめ</div><div class="recommend-title">' + next.icon + ' ' + next.title + '</div><div class="recommend-desc">約' + next.estimatedMinutes + '分で学べます</div></div>';
}

// ===== コース一覧 =====
function buildCourseCard(course) {
  var courseChapters = getCourseChapters(course.id);
  var total = courseChapters.length;
  var completed = courseChapters.filter(function(c) { return c.status === 'completed'; }).length;
  var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  return '<div class="course-card ' + course.color + '" onclick="openCourse(\'' + course.id + '\')">' +
    '<div class="course-icon">' + course.icon + '</div>' +
    '<div class="course-title">' + escapeHtml(course.title) + '</div>' +
    '<div class="course-desc">' + escapeHtml(course.description) + '</div>' +
    '<div class="course-progress-wrap">' +
      '<div class="course-progress-bar"><div class="course-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="course-progress-text">' + completed + ' / ' + total + ' チャプター完了</div>' +
    '</div>' +
  '</div>';
}

function renderCourseList() {
  var list = document.getElementById('course-list');
  var html = '';
  COURSE_CATEGORIES.forEach(function(cat) {
    var catCourses = COURSES.filter(function(c) { return c.category === cat.id; });
    if (catCourses.length === 0) return;
    html += '<h3 class="section-title" style="margin-top:20px;margin-bottom:12px;font-size:1rem;">' + cat.label + '</h3>';
    html += '<div class="course-list" style="margin-bottom:8px;">';
    html += catCourses.map(function(course) { return buildCourseCard(course); }).join('');
    html += '</div>';
  });
  list.innerHTML = html;
}

function renderCustomChaptersOnHome() {
  var customs = chapters.filter(function(c) { return c.id.startsWith('chapter_custom_'); });
  var area = document.getElementById('custom-chapters-area');
  var list = document.getElementById('custom-chapter-list');
  if (customs.length === 0) { area.style.display = 'none'; return; }
  area.style.display = 'block';
  list.innerHTML = customs.map(function(ch) { return buildChapterCard(ch); }).join('');
}

function getCourseChapters(courseId) {
  var course = COURSES.find(function(c) { return c.id === courseId; });
  if (!course) return [];
  return course.chapterIds.map(function(cid) {
    return chapters.find(function(ch) { return ch.id === cid; });
  }).filter(function(ch) { return !!ch; });
}

function openCourse(courseId) {
  currentCourseId = courseId;
  switchScreen('course');
}

function renderCourseDetail() {
  var course = COURSES.find(function(c) { return c.id === currentCourseId; });
  if (!course) return;
  var courseChapters = getCourseChapters(course.id);
  var total = courseChapters.length;
  var completed = courseChapters.filter(function(c) { return c.status === 'completed'; }).length;
  var pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById('course-detail-title').textContent = course.icon + ' ' + course.title;
  document.getElementById('course-detail-meta').textContent = total + 'チャプター • ' + completed + '完了';

  document.getElementById('course-detail-hero').innerHTML =
    '<div class="course-detail-hero course-card ' + course.color + '">' +
      '<div class="cdh-icon">' + course.icon + '</div>' +
      '<div class="cdh-desc">' + escapeHtml(course.description) + '</div>' +
      '<div class="cdh-progress">' +
        '<div class="cdh-progress-bar"><div class="cdh-progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="cdh-progress-text">' + pct + '% 完了（' + completed + '/' + total + '）</div>' +
      '</div>' +
    '</div>';

  document.getElementById('course-chapter-list').innerHTML =
    courseChapters.map(function(ch) { return buildChapterCard(ch); }).join('');
}

function buildChapterCard(ch) {
  var labels = { not_started: '未学習', in_progress: '学習中', completed: '完了' };
  return '<div class="chapter-card" onclick="openChapter(\'' + ch.id + '\')"><div class="chapter-icon ' + ch.color + '">' + ch.icon + '</div><div class="chapter-info"><div class="chapter-title">' + escapeHtml(ch.title) + '</div><div class="chapter-meta"><span class="status-badge ' + ch.status + '">' + labels[ch.status] + '</span><span>約' + ch.estimatedMinutes + '分</span></div></div><span class="chapter-arrow">›</span></div>';
}

// ===== 学習画面 =====
function setupLearningTabs() {
  document.querySelectorAll('.learning-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.learning-tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentLearnFilter = tab.dataset.filter;
      renderLearnList();
    });
  });
}

function renderLearn() {
  var total = chapters.length;
  var completed = chapters.filter(function(c) { return c.status === 'completed'; }).length;
  var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('learn-stat-progress').textContent = pct + '%';
  document.getElementById('learn-stat-done').textContent = completed;
  document.getElementById('learn-stat-remaining').textContent = (total - completed);
  renderLearnList();
}

function renderLearnList() {
  var list = document.getElementById('learn-chapter-list');
  var filtered = (currentLearnFilter === 'all') ? chapters : chapters.filter(function(c) { return c.status === currentLearnFilter; });
  if (filtered.length === 0) {
    var msgs = { all: 'チャプターがありません', in_progress: '学習中のチャプターはありません', not_started: '未学習のチャプターはありません', completed: '完了したチャプターはありません' };
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">' + msgs[currentLearnFilter] + '</div></div>';
    return;
  }
  list.innerHTML = filtered.map(function(ch) { return buildChapterCard(ch); }).join('');
}

// ===== チャプター詳細 =====
function openChapter(chapterId) {
  var chapter = chapters.find(function(c) { return c.id === chapterId; });
  if (!chapter) return;
  if (chapter.status === 'not_started') { chapter.status = 'in_progress'; saveUserData(); }
  document.getElementById('detail-title').textContent = chapter.icon + ' ' + chapter.title;
  var statusText = chapter.status === 'completed' ? '✅ 完了済み' : '📖 学習中';
  document.getElementById('detail-meta').textContent = '約' + chapter.estimatedMinutes + '分 • ' + statusText;

  var content = chapter.content;
  if (!content) {
    document.getElementById('detail-content').innerHTML = '<div class="content-section" style="text-align:center;padding:48px 20px;"><div style="font-size:3rem;margin-bottom:12px;">📄</div><p style="color:var(--text-secondary);">コンテンツは準備中です</p></div>';
    switchScreen('detail');
    return;
  }

  var isCompleted = chapter.status === 'completed';
  document.getElementById('detail-content').innerHTML =
    '<div class="detail-hero"><div class="hero-icon">' + chapter.icon + '</div><div class="hero-desc">' + escapeHtml(content.hook) + '</div></div>' +
    '<div class="content-section"><h3>🎯 この章で学べること</h3><ul class="goals-list">' + content.goals.map(function(g) { return '<li><span class="goal-check">✅</span><span>' + escapeHtml(g) + '</span></li>'; }).join('') + '</ul></div>' +
    '<div class="content-section"><h3>📖 本文</h3><div class="body-content">' + content.body + '</div></div>' +
    '<div class="content-section"><h3>💡 ポイントまとめ</h3><div class="points-grid">' + content.points.map(function(p, i) { return '<div class="point-card"><div class="point-num">' + (i + 1) + '</div><div class="point-text">' + escapeHtml(p) + '</div></div>'; }).join('') + '</div></div>' +
    '<div class="content-section"><h3>🏋️ 実践ワーク</h3><div class="practice-box"><div class="practice-label">✏️ TRY IT NOW!</div><div class="practice-text">' + escapeHtml(content.practiceWork) + '</div></div></div>' +
    '<button class="complete-btn ' + (isCompleted ? 'completed' : '') + '" onclick="toggleComplete(\'' + chapterId + '\')">' + (isCompleted ? '✅ 完了済み（タップで取り消し）' : '✅ この章を完了にする') + '</button>';
  switchScreen('detail');
}

function toggleComplete(chapterId) {
  var chapter = chapters.find(function(c) { return c.id === chapterId; });
  if (!chapter) return;
  if (chapter.status === 'completed') { chapter.status = 'in_progress'; showToast('完了を取り消しました'); }
  else { chapter.status = 'completed'; showToast('🎉 チャプター完了！おめでとう！'); }
  saveUserData();
  openChapter(chapterId);
}

// ===== マイページ =====
function renderMyPage() {
  var total = chapters.length;
  var completed = chapters.filter(function(c) { return c.status === 'completed'; }).length;
  var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-progress').textContent = pct + '%';
  updateProfileSection();
}

// ===== UI ヘルパー =====
function showToast(message) {
  var toast = document.getElementById('toast');
  toast.textContent = message; toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2800);
}
function escapeHtml(str) { if (!str) return ''; var div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
</script>
